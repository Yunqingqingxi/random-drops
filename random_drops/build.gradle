// yg-drops（random_drops）—— 随机掉落玩法包，完全独立的 gradle 构建。
//
// 插件 id 必须是 `net.fabricmc.fabric-loom`（NoRemap 变体），不是 `fabric-loom`（完整版）。
// 原因：26.2 是自定义 MC 版本，分发时已是「官方命名」形态，无 yarn/intermediary 映射。
// 完整版 loom 强制要求 mappings 有依赖；NoRemap 变体不需要 mappings，依赖用普通 implementation。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.yunxigames'
version = project.mod_version

base {
	archivesName = "yg-drops"
}

loom {
	mods {
		"yg_drops" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

// JDK 24 字节码（工具链无关，仅控制 release）
tasks.withType(JavaCompile).configureEach {
	it.options.release = 24
}

// fabric.mod.json 的版本占位展开
tasks.withType(ProcessResources).configureEach {
	def ver = project.version
	inputs.property "version", ver
	filesMatching("fabric.mod.json") {
		expand "version": ver
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
