pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// yunxigames 系列：一个仓库、五个玩法包，每个包各出一个独立 jar。
// 五个包**互相完全独立、零跨包依赖** —— 每包自带 Yg/YgConfig/SelfTest/SessionStats/LootSupply
// 的源码副本（都在 com.yunxigames 包下，同名类各 jar 一份），所以可以单独安装、任意组合。
rootProject.name = 'yunxigames'
include 'drops', 'bingo', 'enchants', 'events', 'mobs'

// 开发期工具包：生物外观预览。烘焙真实模型 + 软件光栅化出三视图，
// 不用启动客户端。做新生物 / 调外观时用它当"眼睛"。
include 'mobkit'
